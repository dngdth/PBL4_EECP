[project]
name = "eecp-api"
version = "0.1.0"
description = "EECP FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "redis>=6.4,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

