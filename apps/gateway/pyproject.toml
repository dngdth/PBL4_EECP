[project]
name = "eecp-local-gateway"
version = "0.1.0"
description = "EECP Local Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
    "websockets>=15,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
